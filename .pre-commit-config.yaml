repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-added-large-files
    -   id: check-merge-conflict
    -   id: check-toml
    -   id: check-yaml
    -   id: debug-statements
    -   id: name-tests-test
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
    -   id: ruff-check
        args: [--fix]
    -   id: ruff-format
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
    -   id: mypy
        additional_dependencies: [pyjson5, pytest]
# Run this repo's own hook against itself.
-   repo: local
    hooks:
    -   id: check-pyjson5
        name: check pyjson5
        entry: python pypackages/pre_commit_hooks/check_pyjson5.py
        language: python
        types_or: [json, json5]
        additional_dependencies: [pyjson5]
