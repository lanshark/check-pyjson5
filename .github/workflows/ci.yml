name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        pyjson5: ['1.*', '2.*']
        exclude:
          # pyjson5 1.x has no wheels for 3.14 and would build from source.
          - python-version: '3.14'
            pyjson5: '1.*'
    name: py${{ matrix.python-version }} / pyjson5 ${{ matrix.pyjson5 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest "pyjson5==${{ matrix.pyjson5 }}" .
      - run: check_pyjson5 --help
      - run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pre-commit/action@v3.0.1
